<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座席決定アプリ</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 24px;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 教室レイアウト（横方向に7列配置） */
    .classroom {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      justify-content: center;
      width: 100%;
    }

    .column-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .column-label {
      font-weight: bold;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .column-seats {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 座席セル */
    .seat {
      width: 56px;
      height: 48px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      background-color: #fff;
      transition: all 0.2s ease;
      user-select: none;
    }

    /* 両端最後尾の空席枠 */
    .seat.empty {
      border: 2px dashed #e2e8f0;
      background-color: #f8fafc;
      opacity: 0.35;
    }

    .seat.active {
      border-color: var(--primary-color);
      background-color: #e0e7ff;
      color: var(--primary-color);
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
    }

    .controls {
      margin-top: 32px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background-color: #64748b;
      box-shadow: none;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <h1>座席決定アプリ</h1>

  <div class="container">
    <div class="classroom" id="classroom"></div>

    <div class="controls">
      <button class="btn btn-secondary" onclick="resetSeats()">リセット</button>
      <button class="btn" id="drawBtn" onclick="drawAllSeats()">一括抽選スタート</button>
    </div>
  </div>

  <script>
    // ★発行したご自身のGASウェブアプリURLに書き換えてください★
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyyFPi6i3cq2Pp3gKf0w7bDN75nTYNEHbNz3HUXkMQUNm3k5ho0E2yzxmXM4Kel1Rpx/exec";

    const COLS = 7;
    const ROWS = 6;
    const EXCLUDED = [4, 36, 42, 43];
    const TOTAL_NUMBERS = Array.from({ length: 44 }, (_, i) => i + 1).filter(n => !EXCLUDED.includes(n));
    let isDrawing = false;

    function initClassroom() {
      const classroomEl = document.getElementById('classroom');
      classroomEl.innerHTML = '';

      for (let c = 1; c <= COLS; c++) {
        const colDiv = document.createElement('div');
        colDiv.className = 'column-container';

        const label = document.createElement('div');
        label.className = 'column-label';
        label.textContent = `${c}列`;
        colDiv.appendChild(label);

        const seatsDiv = document.createElement('div');
        seatsDiv.className = 'column-seats';

        for (let r = 1; r <= ROWS; r++) {
          const seat = document.createElement('div');
          
          // 左右両端（1列目・7列目）の最後尾（6行目）は空席マスとして描画
          if ((c === 1 || c === 7) && r === 6) {
            seat.className = 'seat empty';
          } else {
            seat.className = 'seat';
            seat.dataset.col = c;
            seat.dataset.row = r;
          }
          seatsDiv.appendChild(seat);
        }

        colDiv.appendChild(seatsDiv);
        classroomEl.appendChild(colDiv);
      }
    }

    function getAllValidSeatElements() {
      return Array.from(document.querySelectorAll('.seat:not(.empty)'));
    }

    async function drawAllSeats() {
      if (isDrawing) return;
      isDrawing = true;
      const drawBtn = document.getElementById('drawBtn');
      drawBtn.disabled = true;
      drawBtn.textContent = '通信・計算中...';

      resetSeats();

      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const placementData = await response.json();

        drawBtn.textContent = '抽選中...';

        const seatMap = new Map();
        placementData.forEach(item => {
          seatMap.set(`${item.col}-${item.row}`, item.number);
        });

        const seats = getAllValidSeatElements();

        // ドラムロールのようなシャッフルアニメーション表示
        for (const seat of seats) {
          seat.classList.add('active');
          const c = seat.dataset.col;
          const r = seat.dataset.row;
          const targetNum = seatMap.get(`${c}-${r}`);

          for (let i = 0; i < 4; i++) {
            seat.textContent = TOTAL_NUMBERS[Math.floor(Math.random() * TOTAL_NUMBERS.length)];
            await new Promise(res => setTimeout(res, 25));
          }

          seat.textContent = targetNum;
          await new Promise(res => setTimeout(res, 50));
          seat.classList.remove('active');
        }

      } catch (error) {
        alert("データの取得に失敗しました。GASのURLや公開設定（全員）を確認してください。");
        console.error(error);
      } finally {
        isDrawing = false;
        drawBtn.disabled = false;
        drawBtn.textContent = '一括抽選スタート';
      }
    }

    function resetSeats() {
      if (isDrawing) return;
      const seats = getAllValidSeatElements();
      seats.forEach(s => {
        s.textContent = '';
        s.classList.remove('active');
      });
    }

    window.onload = initClassroom;
  </script>
</body>
</html>
