<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座席決定アプリ</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .classroom {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .row-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .row-label {
      width: 45px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #64748b;
      text-align: right;
      flex-shrink: 0;
    }

    .row-seats {
      display: flex;
      gap: 8px;
    }

    .teacher-desk {
      width: 60px;
      height: 48px;
      background-color: #e2e8f0;
      border: 2px dashed #94a3b8;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #475569;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .seat {
      width: 56px;
      height: 48px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      background-color: #fff;
      transition: all 0.2s ease;
      user-select: none;
    }

    .seat.active {
      border-color: var(--primary-color);
      background-color: #e0e7ff;
      color: var(--primary-color);
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
    }

    .controls {
      margin-top: 32px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background-color: #64748b;
      box-shadow: none;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <h1>座席決定アプリ</h1>

  <div class="container">
    <div class="classroom" id="classroom"></div>

    <div class="controls">
      <button class="btn btn-secondary" onclick="resetSeats()">リセット</button>
      <button class="btn" id="drawBtn" onclick="drawAllSeats()">一括抽選スタート</button>
    </div>
  </div>

  <script>
    // ★以下にご自身のGASウェブアプリURLを貼り付けてください★
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzGGOPPh2EDRf2ICFr9GknMsZePNt_ZpYy1lnkajXOxUgGORB7ATV1jC8k2kxe1VsA/exec";

    const ROWS = 7;
    const EXCLUDED = [4, 36, 42, 43];
    const TOTAL_NUMBERS = Array.from({ length: 44 }, (_, i) => i + 1).filter(n => !EXCLUDED.includes(n));
    let isDrawing = false;

    function initClassroom() {
      const classroomEl = document.getElementById('classroom');
      classroomEl.innerHTML = '';

      for (let r = 1; r <= ROWS; r++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row-container';

        const label = document.createElement('div');
        label.className = 'row-label';
        label.textContent = `${r}行`;
        rowDiv.appendChild(label);

        if (r === 4) {
          const teacherDesk = document.createElement('div');
          teacherDesk.className = 'teacher-desk';
          teacherDesk.textContent = '教卓';
          rowDiv.appendChild(teacherDesk);
        }

        const seatsDiv = document.createElement('div');
        seatsDiv.className = 'row-seats';

        const cols = (r === 1 || r === 7) ? 5 : 6;

        for (let c = 1; c <= cols; c++) {
          const seat = document.createElement('div');
          seat.className = 'seat';
          seat.dataset.row = r;
          seat.dataset.col = c;
          seat.textContent = '';
          seatsDiv.appendChild(seat);
        }

        rowDiv.appendChild(seatsDiv);
        classroomEl.appendChild(rowDiv);
      }
    }

    function getAllSeatElements() {
      return Array.from(document.querySelectorAll('.seat'));
    }

    async function drawAllSeats() {
      if (isDrawing) return;
      isDrawing = true;
      const drawBtn = document.getElementById('drawBtn');
      drawBtn.disabled = true;
      drawBtn.textContent = '通信・計算中...';

      resetSeats();

      try {
        // GASから条件クリア済みの配置データを受け取る
        const response = await fetch(GAS_WEB_APP_URL);
        const placementData = await response.json();

        drawBtn.textContent = '抽選中...';

        // 位置の対応付けマップを作成
        const seatMap = new Map();
        placementData.forEach(item => {
          seatMap.set(`${item.row}-${item.col}`, item.number);
        });

        const seats = getAllSeatElements();

        // アニメーション表示
        for (const seat of seats) {
          seat.classList.add('active');
          const r = seat.dataset.row;
          const c = seat.dataset.col;
          const targetNum = seatMap.get(`${r}-${c}`);

          for (let i = 0; i < 4; i++) {
            seat.textContent = TOTAL_NUMBERS[Math.floor(Math.random() * TOTAL_NUMBERS.length)];
            await new Promise(res => setTimeout(res, 25));
          }

          seat.textContent = targetNum;
          await new Promise(res => setTimeout(res, 50));
          seat.classList.remove('active');
        }

      } catch (error) {
        alert("データの取得に失敗しました。GASのURLや公開設定を確認してください。");
        console.error(error);
      } finally {
        isDrawing = false;
        drawBtn.disabled = false;
        drawBtn.textContent = '一括抽選スタート';
      }
    }

    function resetSeats() {
      if (isDrawing) return;
      const seats = getAllSeatElements();
      seats.forEach(s => {
        s.textContent = '';
        s.classList.remove('active');
      });
    }

    window.onload = initClassroom;
  </script>
</body>
</html>
